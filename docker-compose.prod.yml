# Живий сервер (спільний VPS). Порти 80/443 тримає Caddy музейного порталу (/opt/mincult).
# Власної мережі проєкт не створює (на VPS скінчилися підмережі Docker): усі сервіси в mincult_default,
# тому імена archive-* мають бути унікальними на сервері. Caddy бере сайт із /opt/caddy-sites/archive.caddy.
services:
  archive-web:
    ports: !reset []

networks:
  default:
    name: mincult_default
    external: true
