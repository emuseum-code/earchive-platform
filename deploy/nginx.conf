# Уся адмінка — Laravel (Filament). Статика Filament і стилі віддаються з тому public.
server {
    listen 80;
    server_name _;
    client_max_body_size 60M;
    root /var/www/html/public;

    location ~* ^/(css|js|fonts)/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; }
    location = /favicon.svg { try_files $uri =404; }
    location / { try_files $uri /index.php?$query_string; }
    location = /index.php {
        fastcgi_pass books-app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 300;
    }
}
