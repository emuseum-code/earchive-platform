# «Архів» на Jam-сервері: Laravel (Filament) через PHP-FPM. Шаблон для deploy/jam/setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name ARCHIVE_DOMAIN;
    root ARCHIVE_ROOT;
    index index.php;
    client_max_body_size 60M;

    location ~* ^/(css|js|fonts)/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:ARCHIVE_SOCK;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_read_timeout 300;
    }
    location ~ /\.(?!well-known) { deny all; }
}
