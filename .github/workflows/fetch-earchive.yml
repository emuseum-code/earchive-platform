# Завантажує PDF документів розділу каталогу earchive.mfa.gov.ua звичайними запитами (з хмари Claude сайт не відкривається)
# і кладе їх у гілку data/earchive-pdfs. Якщо сайт відповідає перевіркою від ботів, нічого не обходимо: крок падає.
name: Fetch earchive PDFs

on:
  workflow_dispatch:
    inputs:
      category:
        description: Розділ каталогу
        default: '2'
      ids:
        description: ID документів через кому (порожньо — усі розділу)
        default: '167,249,474,493,494,598,648,667,692,848'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          CATEGORY: ${{ inputs.category }}
          IDS: ${{ inputs.ids }}
        run: |
          mkdir -p /tmp/out
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          d = json.load(open(f"admin/database/data/earchive/category-{os.environ['CATEGORY']}.json"))
          ids = {int(i) for i in os.environ['IDS'].split(',') if i.strip()}
          ok = 0
          for doc in d['documents']:
              if ids and doc['id'] not in ids:
                  continue
              url = 'https://earchive.mfa.gov.ua' + urllib.parse.quote(doc['file'])
              out = '/tmp/out/' + os.path.basename(doc['file'])
              r = subprocess.run(['curl', '-sSL', '--max-time', '120', '-o', out, '-w', '%{http_code} %{content_type}', url], capture_output=True, text=True)
              head = open(out, 'rb').read(5) if os.path.exists(out) else b''
              print(doc['id'], r.stdout, r.stderr.strip(), head)
              if head == b'%PDF-':
                  ok += 1
              elif os.path.exists(out):
                  os.remove(out)
          print('PDF:', ok)
          if not ok:
              raise SystemExit('no PDFs downloaded')
          PY
          ls -la /tmp/out
      - name: Commit to data/earchive-pdfs
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data/earchive-pdfs && git checkout data/earchive-pdfs || git checkout --orphan data/earchive-pdfs
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p pdf && cp /tmp/out/*.pdf pdf/
          git add pdf && git commit -qm "PDF earchive.mfa.gov.ua, розділ ${{ inputs.category }}" && git push origin data/earchive-pdfs
